<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu | ShopOnline</title>
    <link rel="stylesheet" href="/css/main.css?v=2.0">
</head>
<body>
    <!-- Topbar Header -->
    <nav class="topbar">
        <div class="topbar-main">
            <div class="brand-wrap">
                <a class="logo" href="/">ShopOnline</a>
                <p class="tagline">Khôi phục mật khẩu</p>
            </div>

            <div class="topbar-session">
                <a class="secondary-btn" href="/login.html">← Quay lại đăng nhập</a>
                <div id="auth-nav-slot" class="auth-slot"></div>
            </div>
        </div>
    </nav>

    <main class="login-page">
        <section class="auth-shell single-auth-shell">
            <div class="login-card">
                <p class="section-kicker">BẢO MẬT TÀI KHOẢN</p>
                <h2>Tạo mật khẩu mới</h2>
                <p class="subtext">Nhập email và thiết lập mật khẩu mới cho tài khoản của bạn.</p>

                <form id="reset-password-form" class="login-form">
                    <div class="form-group">
                        <label for="reset-email">Địa chỉ Email</label>
                        <input type="email" id="reset-email" placeholder="ban@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="reset-new-password">Mật khẩu mới</label>
                        <input type="password" id="reset-new-password" placeholder="Ít nhất 6 ký tự" required>
                    </div>

                    <div class="form-group">
                        <label for="reset-confirm-password">Xác nhận mật khẩu</label>
                        <input type="password" id="reset-confirm-password" placeholder="Nhập lại mật khẩu mới" required>
                    </div>

                    <button type="submit" class="primary-btn">Đặt lại mật khẩu</button>
                </form>

                <p id="reset-password-message" class="login-message"></p>
                <p class="auth-switch">
                    Đã nhớ mật khẩu?
                    <a class="inline-link" href="/login.html">Đăng nhập</a>
                </p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="storefront-footer">
        <div class="footer-bottom">
            <p>© 2026 ShopOnline E-Commerce Platform. Tất cả các quyền được bảo lưu.</p>
        </div>
    </footer>

    <script src="/js/env.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
